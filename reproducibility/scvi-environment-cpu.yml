name: scvi
# CPU-only variant of scvi-environment.yml: no CUDA wheels, no nvidia-* or
# triton packages, torch runs on CPU (torch.cuda.is_available() is False).
# torch/torchaudio/torchvision are pinned to the +cpu wheels from the
# PyTorch CPU index (--extra-index-url below; the +cpu local version only
# exists there, so the pin is deterministic). Verified 2026-08-16 on a fresh
# env built from this file: imports, preprocessing validation, HPO dry-run,
# HPO ranking, and a small scVI training smoke test all pass on CPU.
# On hosts with an old system libstdc++ (missing GLIBCXX_3.4.29, e.g. this
# WSL box), import torch fails inside numpy unless LD_LIBRARY_PATH includes
# the env lib; `conda env config vars set LD_LIBRARY_PATH=$CONDA_PREFIX/lib`
# on the created env fixes this at activation (see README).
# jax/jaxlib stay as-is (jaxlib 0.10.0 wheels are CPU-only).
channels:
  - defaults
  - conda-forge
  - bioconda
dependencies:
  - _libgcc_mutex=0.1=main
  - _openmp_mutex=5.1=1_gnu
  - _r-mutex=1.0.0=anacondar_1
